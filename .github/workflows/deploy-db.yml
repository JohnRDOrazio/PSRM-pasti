name: Deploy database

# Applies supabase/migrations to the production Supabase project.
# The app itself is deployed by Vercel's Git integration; migrations are additive,
# so the two can run independently.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: npx supabase db push
